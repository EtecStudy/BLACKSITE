name: Black Sight · Etapa 1 (importar, testar, exportar)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/aa5e0e47-blacksite

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  GODOT_DIR: ".godot-ci"
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  build:
    name: Linux — importar, testar e validar o pacote
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências (Xvfb, Mesa, zip, imagemagick)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 mesa-utils zip imagemagick
          mkdir -p ci-logs

      - name: Baixar Godot ${GODOT_VERSION}
        run: |
          mkdir -p "$GODOT_DIR"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q godot.zip -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"
          "$GODOT_DIR/godot" --version | tee ci-logs/godot-version.txt

      - name: Baixar templates de exportação ${GODOT_VERSION}
        run: |
          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q templates.tpz -d /tmp/godot_templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$TEMPLATE_DIR"
          cp -r /tmp/godot_templates/templates/. "$TEMPLATE_DIR/"
          ls "$TEMPLATE_DIR" | grep -Ei "windows|linux" | tee ci-logs/templates.txt

      - name: Importar recursos do projeto
        run: |
          "$GODOT_DIR/godot" --headless --path . --import 2>&1 | tee ci-logs/import.log
          test -d .godot/imported
          echo "recursos importados: $(ls .godot/imported | wc -l)"

      # ------------------------------------------------------------------
      # 1. Testes do projeto no editor/headless
      # ------------------------------------------------------------------
      - name: TESTE 1 — fumaça da configuração e da cena (headless)
        run: |
          set -o pipefail
          "$GODOT_DIR/godot" --headless --path . --script res://tools/ci/smoke_test.gd 2>&1 | tee ci-logs/smoke.log

      - name: TESTE 2 — executar a cena inicial (headless, 240 frames)
        run: |
          set -o pipefail
          "$GODOT_DIR/godot" --headless --path . --audio-driver Dummy --quit-after 240 2>&1 | tee ci-logs/run_headless.log
          grep -F "[Black Sight] Tela inicial carregada" ci-logs/run_headless.log
          grep -nE "SCRIPT ERROR|ERROR:" ci-logs/run_headless.log || echo "(nenhum erro registrado)"
          if grep -q "SCRIPT ERROR" ci-logs/run_headless.log; then
            echo "::error::Erros de script durante a execução da cena inicial"
            exit 1
          fi

      - name: TESTE 3 — renderizar a cena inicial (Xvfb + OpenGL/llvmpipe)
        run: |
          mkdir -p ci-logs/frames
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "$GODOT_DIR/godot" --path . \
            --rendering-driver opengl3 \
            --audio-driver Dummy \
            --fixed-fps 30 \
            --write-movie ci-logs/frames/frame.png \
            --quit-after 90 2>&1 | tee ci-logs/render.log
          latest=$(ls ci-logs/frames/*.png | tail -1)
          cp "$latest" ci-logs/render_frame.png
          rm -rf ci-logs/frames
          test -s ci-logs/render_frame.png
          echo "frame capturado: $latest"

      # ------------------------------------------------------------------
      # 2. Exportações
      # ------------------------------------------------------------------
      - name: TESTE 4 — exportar executável Windows (release)
        run: |
          mkdir -p build/windows
          set +e
          "$GODOT_DIR/godot" --headless --path . --export-release "Windows Desktop" "build/windows/BlackSight.exe" 2>&1 | tee ci-logs/export_windows.log
          set -e
          if [ ! -s build/windows/BlackSight.exe ]; then
            echo "::warning::Exportação com modificação de recursos falhou; tentando sem metadados embutidos."
            sed -i 's|application/modify_resources=true|application/modify_resources=false|' export_presets.cfg
            rm -rf build/windows
            mkdir -p build/windows
            "$GODOT_DIR/godot" --headless --path . --export-release "Windows Desktop" "build/windows/BlackSight.exe" 2>&1 | tee -a ci-logs/export_windows.log
          fi
          ls -la build/windows
          test -s build/windows/BlackSight.exe
          test -s build/windows/BlackSight.pck

      - name: Exportar build Linux (para executar o pacote exportado)
        run: |
          mkdir -p build/linux
          "$GODOT_DIR/godot" --headless --path . --export-release "Linux" "build/linux/BlackSight.x86_64" 2>&1 | tee ci-logs/export_linux.log
          chmod +x build/linux/BlackSight.x86_64
          ls -la build/linux
          test -s build/linux/BlackSight.x86_64
          test -s build/linux/BlackSight.pck

      # ------------------------------------------------------------------
      # 3. Verificações dos binários
      # ------------------------------------------------------------------
      - name: TESTE 5 — executar o BUILD EXPORTADO (não-editor) sob Xvfb
        run: |
          cd build/linux
          timeout 120 xvfb-run -a --server-args="-screen 0 1280x800x24" \
            ./BlackSight.x86_64 --audio-driver Dummy --quit-after 180 > ../../ci-logs/exported_run.log 2>&1 || true
          cd ../..
          cat ci-logs/exported_run.log
          grep -F "[Black Sight] Tela inicial carregada" ci-logs/exported_run.log
          # Erros de áudio do runner headless (ALSA/audio_server) não são erros do jogo.
          if grep -E "SCRIPT ERROR|ERROR:" ci-logs/exported_run.log \
              | grep -vE "ALSA|audio_driver|init_output_device|audio_server"; then
            echo "::error::Erros ao executar o build exportado"
            exit 1
          fi

      - name: TESTE 6 — inspecionar o pacote .pck exportado
        run: |
          set -o pipefail
          python3 tools/ci/inspect_pck.py build/windows/BlackSight.pck | tee ci-logs/pck-windows.txt
          python3 tools/ci/inspect_pck.py build/linux/BlackSight.pck | tee ci-logs/pck-linux.txt

      - name: TESTE 7 — validar o binário Windows (.exe)
        run: |
          file build/windows/BlackSight.exe | tee ci-logs/binary-check.log
          file build/windows/BlackSight.exe | grep -qi "PE32+"
          file build/windows/BlackSight.exe | grep -qi "x86-64"
          (strings -a -e l build/windows/BlackSight.exe | grep -m 8 -E "Black Sight|EtecStudy|0\\.1\\.0" || echo "(metadados de versão não localizados)") | tee ci-logs/exe-strings.txt
          if ! strings -a -e l build/windows/BlackSight.exe | grep -q "Black Sight"; then
            echo "::warning::Metadados de versão não localizados no .exe (exportação sem modify_resources)."
          fi
          sha256sum build/windows/BlackSight.exe build/windows/BlackSight.pck | tee build/windows/SHA256SUMS.txt
          du -h build/windows/*

      # ------------------------------------------------------------------
      # 4. Empacotamento e distribuição
      # ------------------------------------------------------------------
      - name: Empacotar para distribuição
        run: |
          cat > build/windows/LEIA-ME.txt <<'EOF'
          BLACK SIGHT — Etapa 1 (Windows x86_64)
          ======================================

          COMO JOGAR
          1. Extraia todos os arquivos deste ZIP para a mesma pasta.
          2. Dê duplo clique em BlackSight.exe.
             (BlackSight.pck precisa estar na mesma pasta do .exe)

          CONTROLES
          - F11 .......... alterna entre janela e tela cheia
          - SAIR DO JOGO . fecha o jogo
          - Alt+F4 ....... fecha o jogo

          REQUISITOS
          - Windows 10 ou 11 (64 bits)
          - Placa de vídeo com suporte a OpenGL 3.3 ou superior
            (renderizador GL Compatibility; funciona em GPUs integradas)

          OBSERVAÇÃO
          Esta é a fundação do projeto: a cena inicial ainda não tem jogabilidade.
          Jogador, mapa, inventário e criaturas entram nas próximas etapas.

          Versão 0.1.0 — Etapa 1
          EOF
          cd build/windows
          zip -9 -r ../../BlackSight-Etapa1-Windows-x86_64.zip \
            BlackSight.exe BlackSight.pck LEIA-ME.txt SHA256SUMS.txt
          cd ../..
          ls -la BlackSight-Etapa1-Windows-x86_64.zip
          sha256sum BlackSight-Etapa1-Windows-x86_64.zip | tee ci-logs/zip-sha256.txt

      - name: TESTE 8 — listar o conteúdo do ZIP
        run: |
          unzip -l BlackSight-Etapa1-Windows-x86_64.zip | tee ci-logs/zip-listing.txt
          unzip -l BlackSight-Etapa1-Windows-x86_64.zip | grep -q "BlackSight.exe"
          unzip -l BlackSight-Etapa1-Windows-x86_64.zip | grep -q "BlackSight.pck"
          unzip -l BlackSight-Etapa1-Windows-x86_64.zip | grep -q "LEIA-ME.txt"
          unzip -t BlackSight-Etapa1-Windows-x86_64.zip | tail -2

      - name: TESTE 9 — executar o .exe com Wine
        id: wine
        continue-on-error: true
        run: |
          for pkg in wine64 wine wine-stable; do
            echo "--- tentando instalar: $pkg ---"
            if sudo apt-get install -y --no-install-recommends "$pkg" >> ci-logs/wine-install.log 2>&1; then
              if command -v wine > /dev/null 2>&1 || command -v wine64 > /dev/null 2>&1; then
                echo "$pkg instalado" | tee -a ci-logs/wine-install.log
                break
              fi
            fi
          done
          (wine --version || wine64 --version || echo "sem wine") | tee ci-logs/wine-version.txt
          if ! command -v wine > /dev/null 2>&1; then
            echo "::warning::Wine indisponível neste runner — o .exe não pôde ser executado aqui."
            echo "indisponivel" > ci-logs/wine-status.txt
            exit 0
          fi

          export WINEPREFIX="$HOME/.wineprefix"
          export WINEDEBUG=-all
          export WINEDLLOVERRIDES="mscoree,mshtml="
          wineboot -u > ci-logs/wineboot.log 2>&1 || true

          cd build/windows
          echo "=== tentativa A: modo headless (sem GPU) ==="
          set +e
          timeout 300 wine BlackSight.exe --headless --audio-driver Dummy --quit-after 120 \
            > ../../ci-logs/wine_headless.log 2>&1
          headless_exit=$?
          set -e
          echo "exit headless: $headless_exit" | tee ../../ci-logs/wine-headless-exit.txt
          cat ../../ci-logs/wine_headless.log || true
          if grep -qF "[Black Sight] Tela inicial carregada" ../../ci-logs/wine_headless.log; then
            echo "OK: o .exe iniciou e carregou a cena inicial via Wine (headless)" | tee ../../ci-logs/wine-status.txt
          else
            echo "headless-falhou" > ../../ci-logs/wine-status.txt
          fi

          echo "=== tentativa B: janela + OpenGL (Xvfb) ==="
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > /dev/null 2>&1 &
          xvfb_pid=$!
          sleep 2
          export DISPLAY=:99
          set +e
          ( timeout 120 wine BlackSight.exe --rendering-driver opengl3 --audio-driver Dummy \
              > ../../ci-logs/wine_windowed.log 2>&1 ; echo $? > /tmp/wine_exit ) &
          game_pid=$!
          set -e
          sleep 45
          if kill -0 "$game_pid" 2> /dev/null; then
            echo "processo wine ainda ativo após 45s — capturando a tela"
            import -window root ../../ci-logs/wine_screenshot.png || true
            if grep -qF "[Black Sight] Tela inicial carregada" ../../ci-logs/wine_windowed.log; then
              echo "ok: .exe carregou a cena inicial via Wine" > ../../ci-logs/wine-status.txt
            else
              echo "processo vivo, mas sem confirmação de inicialização (ver screenshot)" > ../../ci-logs/wine-status.txt
            fi
          else
            echo "processo encerrou antes da captura"
            import -window root ../../ci-logs/wine_screenshot.png || true
          fi
          for i in $(seq 1 40); do
            kill -0 "$game_pid" 2> /dev/null || break
            sleep 2
          done
          kill "$game_pid" 2> /dev/null || true
          kill "$xvfb_pid" 2> /dev/null || true
          echo "exit janela: $(cat /tmp/wine_exit 2>/dev/null || echo 'n/d')" | tee -a ci-logs/wine-headless-exit.txt
          tail -30 ../../ci-logs/wine_windowed.log || true

      - name: Publicar artefatos do workflow
        uses: actions/upload-artifact@v4
        with:
          name: black-sight-etapa1-windows
          path: |
            BlackSight-Etapa1-Windows-x86_64.zip
            ci-logs/render_frame.png
            ci-logs/wine_screenshot.png
          if-no-files-found: warn

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-sight-etapa1-logs
          path: ci-logs/
          if-no-files-found: warn

      - name: Publicar diagnóstico no branch ci-diagnostics
        if: always()
        continue-on-error: true
        run: |
          # Canal de diagnóstico: publica logs/frames num branch temporário
          # (os artefatos de Actions não são acessíveis pelo ambiente de desenvolvimento).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-diagnostics
          git rm -rf --cached . > /dev/null 2>&1 || true
          mkdir -p .ci
          rm -rf .ci/*
          cp -r ci-logs .ci/ci-logs 2>/dev/null || true
          cp ci-logs/wine_screenshot.png .ci/ 2>/dev/null || true
          cp build/windows/SHA256SUMS.txt .ci/ 2>/dev/null || true
          git add -f .ci
          git commit -m "ci: diagnóstico da execução ${GITHUB_RUN_ID} (${GITHUB_RUN_ATTEMPT})" || true
          git push -f origin ci-diagnostics

      - name: Resumo da execução
        if: always()
        run: |
          {
            echo "## Black Sight · Etapa 1"
            echo ""
            echo "- Godot: ${GODOT_VERSION}-${GODOT_STATUS}"
            echo "- Commit: $GITHUB_SHA"
            echo ""
            echo "### Teste de fumaça"
            echo '```'
            grep -E "SMOKE TEST|✗" ci-logs/smoke.log 2>/dev/null | tail -20 || true
            echo '```'
            echo ""
            echo "### Cena inicial"
            echo '```'
            grep -E "Tela inicial carregada|ERROR" ci-logs/run_headless.log 2>/dev/null | head -10 || true
            grep -E "Tela inicial carregada|ERROR" ci-logs/exported_run.log 2>/dev/null | head -10 || true
            echo '```'
            echo ""
            echo "### Binário"
            echo '```'
            cat ci-logs/binary-check.log 2>/dev/null || true
            cat ci-logs/wine-version.txt 2>/dev/null || true
            cat ci-logs/wine-exit.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Exportar e testar o .exe em Windows real
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar Godot ${GODOT_VERSION} (Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path godot-ci | Out-Null
          $url = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-$env:GODOT_STATUS/Godot_v$env:GODOT_VERSION-$env:GODOT_STATUS_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile godot.zip -UseBasicParsing
          Expand-Archive -Path godot.zip -DestinationPath godot-ci -Force
          Get-ChildItem godot-ci | Select-Object Name, Length
          & "godot-ci/Godot_v$env:GODOT_VERSION-$env:GODOT_STATUS_win64.exe" --version

      - name: Instalar templates de exportação
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-$env:GODOT_STATUS/Godot_v$env:GODOT_VERSION-$env:GODOT_STATUS_export_templates.tpz"
          Invoke-WebRequest -Uri $url -OutFile templates.zip -UseBasicParsing
          Expand-Archive -Path templates.zip -DestinationPath templates_extract -Force
          $dest = Join-Path $env:APPDATA "Godot/export_templates/$($env:GODOT_VERSION).$($env:GODOT_STATUS)"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "templates_extract/templates/*" -Destination $dest -Recurse -Force
          Get-ChildItem $dest | Where-Object { $_.Name -like "*windows*" } | Select-Object Name

      - name: Importar recursos do projeto
        shell: pwsh
        run: |
          $godot = "godot-ci/Godot_v$env:GODOT_VERSION-$env:GODOT_STATUS_win64.exe"
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          & $godot --headless --path . --import 2>&1 | Tee-Object -FilePath ci-logs/import-windows.log
          if (-not (Test-Path .godot/imported)) { throw "Importação falhou" }

      - name: TESTE W1 — teste de fumaça (headless, Windows)
        shell: pwsh
        run: |
          $godot = "godot-ci/Godot_v$env:GODOT_VERSION-$env:GODOT_STATUS_win64.exe"
          & $godot --headless --path . --script res://tools/ci/smoke_test.gd 2>&1 | Tee-Object -FilePath ci-logs/smoke-windows.log
          if ($LASTEXITCODE -ne 0) { throw "Teste de fumaça falhou no Windows (exit $LASTEXITCODE)" }

      - name: TESTE W2 — exportar o executável Windows
        shell: pwsh
        run: |
          $godot = "godot-ci/Godot_v$env:GODOT_VERSION-$env:GODOT_STATUS_win64.exe"
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          & $godot --headless --path . --export-release "Windows Desktop" "build/windows/BlackSight.exe" 2>&1 | Tee-Object -FilePath ci-logs/export-windows.log
          Get-ChildItem build/windows | Select-Object Name, Length
          if (-not (Test-Path build/windows/BlackSight.exe)) { throw "BlackSight.exe não foi gerado" }
          if (-not (Test-Path build/windows/BlackSight.pck)) { throw "BlackSight.pck não foi gerado" }

      - name: TESTE W3 — executar o .exe exportado no Windows (headless)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = "ci-logs/run-exe-headless.log"
          $proc = Start-Process -FilePath "build/windows/BlackSight.console.exe" `
            -ArgumentList "--headless","--audio-driver","Dummy","--quit-after","240" `
            -RedirectStandardOutput $log -RedirectStandardError "ci-logs/run-exe-headless.err.log" `
            -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(120000)) { $proc.Kill(); throw "O .exe não terminou em 120s" }
          Get-Content $log
          if (-not (Select-String -Path $log -SimpleMatch "[Black Sight] Tela inicial carregada")) {
            throw "O .exe não registrou a inicialização da cena inicial"
          }
          if (Select-String -Path $log -Pattern "SCRIPT ERROR") { throw "SCRIPT ERROR no .exe" }
          "OK: o .exe exportado iniciou e carregou a cena inicial no Windows" | Out-File ci-logs/windows-exe-status.txt

      - name: TESTE W4 — abrir o .exe com janela no Windows
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "build/windows/BlackSight.exe" -PassThru
          Start-Sleep -Seconds 20
          $alive = -not $proc.HasExited
          $proc.Refresh()
          $title = $proc.MainWindowTitle
          "vivo_apos_20s=$alive" | Out-File ci-logs/windows-window-status.txt
          "titulo_janela=$title" | Out-File ci-logs/windows-window-status.txt -Append
          if ($alive) { Stop-Process -Id $proc.Id -Force }
          Get-Content ci-logs/windows-window-status.txt
          if (-not $alive) { throw "O .exe encerrou sozinho ao abrir com janela" }

      - name: TESTE W5 — inspecionar o pacote .pck e o binário
        shell: pwsh
        run: |
          python tools/ci/inspect_pck.py build/windows/BlackSight.pck | Tee-Object -FilePath ci-logs/pck-windows-real.txt
          if ($LASTEXITCODE -ne 0) { throw "Pacote .pck inválido" }
          Get-Item build/windows/BlackSight.exe | Select-Object Name, Length, VersionInfo | Format-List
          (Get-Item build/windows/BlackSight.exe).VersionInfo | Out-File ci-logs/exe-versioninfo.txt
          Get-Content ci-logs/exe-versioninfo.txt | Select-String "ProductName|FileDescription|FileVersion|CompanyName"

      - name: Empacotar para distribuição
        shell: pwsh
        run: |
          $readme = @"
          BLACK SIGHT — Etapa 1 (Windows x86_64)
          ======================================

          COMO JOGAR
          1. Extraia todos os arquivos deste ZIP para a mesma pasta.
          2. De duplo clique em BlackSight.exe.
             (BlackSight.pck precisa estar na mesma pasta do .exe)

          CONTROLES
          - F11 .......... alterna entre janela e tela cheia
          - SAIR DO JOGO . fecha o jogo
          - Alt+F4 ....... fecha o jogo

          ARQUIVOS
          - BlackSight.exe ......... o jogo (use este)
          - BlackSight.pck ......... dados do jogo (obrigatório)
          - BlackSight.console.exe . mesma build com console (diagnóstico)

          REQUISITOS
          - Windows 10 ou 11 (64 bits)
          - Placa de video com suporte a OpenGL 3.3 ou superior
            (renderizador GL Compatibility; funciona em GPUs integradas)

          OBSERVACAO
          Esta e a fundacao do projeto: a cena inicial ainda nao tem jogabilidade.
          Jogador, mapa, inventario e criaturas entram nas proximas etapas.

          Versao 0.1.0 — Etapa 1
          "@
          $readme | Out-File -FilePath build/windows/LEIA-ME.txt -Encoding utf8
          Get-FileHash build/windows/BlackSight.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  BlackSight.exe" } | Out-File build/windows/SHA256SUMS.txt -Encoding ascii
          Get-FileHash build/windows/BlackSight.pck -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  BlackSight.pck" } | Out-File build/windows/SHA256SUMS.txt -Append -Encoding ascii
          Get-ChildItem build/windows | Select-Object Name, Length
          Compress-Archive -Path build/windows/* -DestinationPath BlackSight-Etapa1-Windows-x86_64.zip -Force
          Get-Item BlackSight-Etapa1-Windows-x86_64.zip | Select-Object Name, Length
          Get-FileHash BlackSight-Etapa1-Windows-x86_64.zip -Algorithm SHA256 | ForEach-Object { $_.Hash } | Out-File ci-logs/zip-sha256.txt
          Add-Content -Path build/windows/SHA256SUMS.txt -Value ""

      - name: Publicar artefatos (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: black-sight-etapa1-windows-real
          path: |
            BlackSight-Etapa1-Windows-x86_64.zip
            ci-logs/windows-exe-status.txt
            ci-logs/windows-window-status.txt
          if-no-files-found: warn

      - name: Publicar logs (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-sight-etapa1-windows-logs
          path: ci-logs/
          if-no-files-found: warn

      - name: Criar release no GitHub
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.0-etapa1 --yes --cleanup-tag 2>$null
          gh release create v0.1.0-etapa1 "BlackSight-Etapa1-Windows-x86_64.zip" --title "Black Sight - Etapa 1 - Fundacao do projeto (Windows x86_64)" --notes-file docs/RELEASE_NOTES_ETAPA1.md

      - name: Resumo (Windows)
        if: always()
        shell: pwsh
        run: |
          @"
          ## Black Sight - Etapa 1 (Windows)
