name: Black Sight · build (importar, testar, exportar)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/aa5e0e47-blacksite
    # Mudanças só de documentação não geram novo build/release:
    # o ZIP publicado continua sendo exatamente o que foi testado.
    paths-ignore:
      - "docs/**"
      - "**.md"

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  GODOT_DIR: ".godot-ci"
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  build:
    name: Linux — importar, testar e validar o pacote
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências (Xvfb, Mesa, zip, imagemagick)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 mesa-utils zip imagemagick
          mkdir -p ci-logs

      - name: Baixar Godot ${GODOT_VERSION}
        run: |
          mkdir -p "$GODOT_DIR"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q godot.zip -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"
          "$GODOT_DIR/godot" --version | tee ci-logs/godot-version.txt

      - name: Baixar templates de exportação ${GODOT_VERSION}
        run: |
          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q templates.tpz -d /tmp/godot_templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$TEMPLATE_DIR"
          cp -r /tmp/godot_templates/templates/. "$TEMPLATE_DIR/"
          ls "$TEMPLATE_DIR" | grep -Ei "windows|linux" | tee ci-logs/templates.txt

      - name: Importar recursos do projeto
        run: |
          "$GODOT_DIR/godot" --headless --path . --import 2>&1 | tee ci-logs/import.log
          test -d .godot/imported
          echo "recursos importados: $(ls .godot/imported | wc -l)"

      # ------------------------------------------------------------------
      # 1. Testes do projeto no editor/headless
      # ------------------------------------------------------------------
      - name: TESTE 1 — fumaça da configuração e da cena (headless)
        run: |
          set -o pipefail
          "$GODOT_DIR/godot" --headless --path . --audio-driver Dummy \
            res://tools/ci/smoke_test.tscn 2>&1 | tee ci-logs/smoke.log
          grep -F "SMOKE TEST OK" ci-logs/smoke.log

      - name: TESTE 1b — fluxo real da interface (headless, troca de cenas)
        run: |
          set -o pipefail
          "$GODOT_DIR/godot" --headless --path . --fixed-fps 60 \
            --audio-driver Dummy res://tools/ci/ui_flow_test.tscn 2>&1 | tee ci-logs/ui-flow.log
          grep -F "UI FLOW OK" ci-logs/ui-flow.log
          if grep -F "✗" ci-logs/ui-flow.log; then
            echo "::error::Falhas no fluxo de interface"
            exit 1
          fi

      - name: TESTE 1c — controlador FPS e cena de teste (headless)
        timeout-minutes: 8
        run: |
          set -o pipefail
          "$GODOT_DIR/godot" --headless --path . --fixed-fps 60 \
            --audio-driver Dummy res://tools/ci/movement_test.tscn 2>&1 | tee ci-logs/movement.log
          grep -F "MOVEMENT TEST OK" ci-logs/movement.log
          if grep -F "✗" ci-logs/movement.log; then
            echo "::error::Falhas no teste do controlador em primeira pessoa"
            exit 1
          fi

      - name: TESTE 1d — drop junto a obstáculos (headless)
        timeout-minutes: 8
        run: |
          set -o pipefail
          "$GODOT_DIR/godot" --headless --path . --fixed-fps 60 \
            --audio-driver Dummy res://tools/ci/drop_obstacle_test.tscn 2>&1 | tee ci-logs/drop_obstacle.log
          grep -F "DROP OBSTACLE TEST OK" ci-logs/drop_obstacle.log
          if grep -F "✗" ci-logs/drop_obstacle.log; then
            echo "::error::Falhas no drop junto a obstáculos"
            exit 1
          fi

      - name: TESTE 1e — sistema modular de salas (headless)
        timeout-minutes: 8
        run: |
          set -o pipefail
          "$GODOT_DIR/godot" --headless --path . --fixed-fps 60 \
            --audio-driver Dummy res://tools/ci/modular_test.tscn 2>&1 | tee ci-logs/modular.log
          grep -F "MODULAR TEST OK" ci-logs/modular.log
          if grep -F "✗" ci-logs/modular.log; then
            echo "::error::Falhas no sistema modular de salas"
            exit 1
          fi

      - name: TESTE 1f — primeiro andar do laboratório (headless)
        timeout-minutes: 12
        run: |
          set -o pipefail
          "$GODOT_DIR/godot" --headless --path . --fixed-fps 60 \
            --audio-driver Dummy res://tools/ci/first_floor_test.tscn 2>&1 | tee ci-logs/first-floor.log
          grep -F "PRIMEIRO ANDAR OK" ci-logs/first-floor.log
          if grep -F "✗" ci-logs/first-floor.log; then
            echo "::error::Falhas na planta do primeiro andar"
            exit 1
          fi

      - name: TESTE 2 — executar a cena inicial (headless, 240 frames)
        run: |
          set -o pipefail
          "$GODOT_DIR/godot" --headless --path . --audio-driver Dummy --quit-after 240 2>&1 | tee ci-logs/run_headless.log
          grep -F "[Black Sight] Tela inicial carregada" ci-logs/run_headless.log
          grep -F "[Black Sight] Configurações carregadas" ci-logs/run_headless.log
          grep -nE "SCRIPT ERROR|ERROR:" ci-logs/run_headless.log || echo "(nenhum erro registrado)"
          if grep -q "SCRIPT ERROR" ci-logs/run_headless.log; then
            echo "::error::Erros de script durante a execução da cena inicial"
            exit 1
          fi

      - name: TESTE 3 — renderizar a cena inicial (Xvfb + OpenGL/llvmpipe)
        run: |
          mkdir -p ci-logs/frames
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "$GODOT_DIR/godot" --path . \
            --rendering-driver opengl3 \
            --audio-driver Dummy \
            --fixed-fps 30 \
            --write-movie ci-logs/frames/frame.png \
            --quit-after 90 2>&1 | tee ci-logs/render.log
          latest=$(ls ci-logs/frames/*.png | tail -1)
          cp "$latest" ci-logs/render_frame.png
          rm -rf ci-logs/frames
          test -s ci-logs/render_frame.png
          echo "frame capturado: $latest"

      - name: TESTE 3b — renderizar a tela de configurações (Xvfb + OpenGL)
        run: |
          mkdir -p ci-logs/settings_frames
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "$GODOT_DIR/godot" --path . res://ui/scenes/settings_screen.tscn \
            --rendering-driver opengl3 --audio-driver Dummy --fixed-fps 30 \
            --write-movie ci-logs/settings_frames/frame.png --quit-after 75 \
            2>&1 | tee ci-logs/render_settings.log
          latest=$(ls ci-logs/settings_frames/*.png | tail -1)
          cp "$latest" ci-logs/settings_screen.png
          rm -rf ci-logs/settings_frames
          test -s ci-logs/settings_screen.png

      - name: TESTE 3c — renderizar a cena de teste da movimentação (Xvfb + OpenGL)
        run: |
          mkdir -p ci-logs/movement_frames
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "$GODOT_DIR/godot" --path . res://match/scenes/movement_test.tscn \
            --rendering-driver opengl3 --audio-driver Dummy --fixed-fps 30 \
            --write-movie ci-logs/movement_frames/frame.png --quit-after 60 \
            2>&1 | tee ci-logs/render_movement.log
          latest=$(ls ci-logs/movement_frames/*.png | tail -1)
          cp "$latest" ci-logs/movement_test.png
          rm -rf ci-logs/movement_frames
          test -s ci-logs/movement_test.png
          echo "frame da cena de teste capturado: $latest"

      - name: TESTE 3d — inventário na cena real (Xvfb + OpenGL, captura de frame)
        run: |
          mkdir -p ci-logs/inventory_frames
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "$GODOT_DIR/godot" --path . res://tools/ci/inventory_visual.tscn \
            --rendering-driver opengl3 --audio-driver Dummy --fixed-fps 30 \
            --write-movie ci-logs/inventory_frames/frame.png --quit-after 240 \
            2>&1 | tee ci-logs/render_inventory.log
          grep -F "INVENTORY VISUAL OK" ci-logs/render_inventory.log
          latest=$(ls ci-logs/inventory_frames/*.png | tail -1)
          cp "$latest" ci-logs/inventory_hud.png
          rm -rf ci-logs/inventory_frames
          test -s ci-logs/inventory_hud.png
          echo "frame do inventário capturado: $latest"

      - name: TESTE 3e — soltar item na cena real (Xvfb + OpenGL, captura de frame)
        run: |
          mkdir -p ci-logs/drop_frames
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "$GODOT_DIR/godot" --path . res://tools/ci/drop_visual.tscn \
            --rendering-driver opengl3 --audio-driver Dummy --fixed-fps 30 \
            --write-movie ci-logs/drop_frames/frame.png --quit-after 210 \
            2>&1 | tee ci-logs/render_drop.log
          grep -F "DROP VISUAL OK" ci-logs/render_drop.log
          latest=$(ls ci-logs/drop_frames/*.png | tail -1)
          cp "$latest" ci-logs/drop_hud.png
          rm -rf ci-logs/drop_frames
          test -s ci-logs/drop_hud.png
          echo "frame do drop capturado: $latest"

      - name: TESTE 3f — renderizar a demonstração modular (Xvfb + OpenGL, captura)
        run: |
          mkdir -p ci-logs/modular_frames
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "$GODOT_DIR/godot" --path . res://match/scenes/modular_demo.tscn \
            --rendering-driver opengl3 --audio-driver Dummy --fixed-fps 30 \
            --write-movie ci-logs/modular_frames/frame.png --quit-after 60 \
            2>&1 | tee ci-logs/render_modular.log
          grep -F "Cena modular carregada" ci-logs/render_modular.log
          latest=$(ls ci-logs/modular_frames/*.png | tail -1)
          cp "$latest" ci-logs/modular_demo.png
          rm -rf ci-logs/modular_frames
          test -s ci-logs/modular_demo.png
          echo "frame da demonstração modular capturado: $latest"

      - name: TESTE 3g — renderizar o primeiro andar (Xvfb + OpenGL, captura)
        run: |
          mkdir -p ci-logs/first_floor_frames
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "$GODOT_DIR/godot" --path . res://match/scenes/laboratory.tscn \
            --rendering-driver opengl3 --audio-driver Dummy --fixed-fps 30 \
            --write-movie ci-logs/first_floor_frames/frame.png --quit-after 60 \
            2>&1 | tee ci-logs/render_first_floor.log
          grep -F "Primeiro andar carregado" ci-logs/render_first_floor.log
          latest=$(ls ci-logs/first_floor_frames/*.png | tail -1)
          cp "$latest" ci-logs/first_floor.png
          rm -rf ci-logs/first_floor_frames
          test -s ci-logs/first_floor.png
          echo "frame do primeiro andar capturado: $latest"

      # ------------------------------------------------------------------
      # 2. Exportações
      # ------------------------------------------------------------------
      - name: TESTE 4 — exportar executável Windows (release)
        run: |
          mkdir -p build/windows
          set +e
          "$GODOT_DIR/godot" --headless --path . --export-release "Windows Desktop" "build/windows/BlackSight.exe" 2>&1 | tee ci-logs/export_windows.log
          set -e
          if [ ! -s build/windows/BlackSight.exe ]; then
            echo "::warning::Exportação com modificação de recursos falhou; tentando sem metadados embutidos."
            sed -i 's|application/modify_resources=true|application/modify_resources=false|' export_presets.cfg
            rm -rf build/windows
            mkdir -p build/windows
            "$GODOT_DIR/godot" --headless --path . --export-release "Windows Desktop" "build/windows/BlackSight.exe" 2>&1 | tee -a ci-logs/export_windows.log
          fi
          ls -la build/windows
          test -s build/windows/BlackSight.exe
          test -s build/windows/BlackSight.pck

      - name: Exportar build Linux (para executar o pacote exportado)
        run: |
          mkdir -p build/linux
          "$GODOT_DIR/godot" --headless --path . --export-release "Linux" "build/linux/BlackSight.x86_64" 2>&1 | tee ci-logs/export_linux.log
          chmod +x build/linux/BlackSight.x86_64
          ls -la build/linux
          test -s build/linux/BlackSight.x86_64
          test -s build/linux/BlackSight.pck

      # ------------------------------------------------------------------
      # 3. Verificações dos binários
      # ------------------------------------------------------------------
      - name: TESTE 5 — executar o BUILD EXPORTADO (não-editor) sob Xvfb
        run: |
          rm -rf "$HOME/.local/share/BlackSight"
          cd build/linux
          timeout 120 xvfb-run -a --server-args="-screen 0 1280x800x24" \
            ./BlackSight.x86_64 --audio-driver Dummy --quit-after 180 > ../../ci-logs/exported_run.log 2>&1 || true
          cd ../..
          cat ci-logs/exported_run.log
          grep -F "[Black Sight] Tela inicial carregada" ci-logs/exported_run.log
          # Erros de áudio do runner headless (ALSA/audio_server) não são erros do jogo.
          if grep -E "SCRIPT ERROR|ERROR:" ci-logs/exported_run.log \
              | grep -vE "ALSA|audio_driver|init_output_device|audio_server"; then
            echo "::error::Erros ao executar o build exportado"
            exit 1
          fi

      - name: TESTE 5b — configurações criadas pelo build exportado (user://)
        run: |
          CFG="$HOME/.local/share/BlackSight/settings.cfg"
          test -f "$CFG"
          cat "$CFG" | tee ci-logs/exported-settings.cfg
          grep -q "master_volume" ci-logs/exported-settings.cfg
          grep -q "mouse_sensitivity_x" ci-logs/exported-settings.cfg
          grep -q "crouch_mode" ci-logs/exported-settings.cfg

      - name: TESTE 6 — inspecionar o pacote .pck exportado
        run: |
          set -o pipefail
          python3 tools/ci/inspect_pck.py build/windows/BlackSight.pck | tee ci-logs/pck-windows.txt
          python3 tools/ci/inspect_pck.py build/linux/BlackSight.pck | tee ci-logs/pck-linux.txt

      - name: TESTE 7 — validar o binário Windows (.exe)
        run: |
          file build/windows/BlackSight.exe | tee ci-logs/binary-check.log
          file build/windows/BlackSight.exe | grep -qi "PE32+"
          file build/windows/BlackSight.exe | grep -qi "x86-64"
          (strings -a -e l build/windows/BlackSight.exe | grep -m 8 -E "Black Sight|EtecStudy|0\\.11\\." || echo "(metadados de versão não localizados)") | tee ci-logs/exe-strings.txt
          if ! strings -a -e l build/windows/BlackSight.exe | grep -q "Black Sight"; then
            echo "::warning::Metadados de versão não localizados no .exe (exportação sem modify_resources)."
          fi
          sha256sum build/windows/BlackSight.exe build/windows/BlackSight.pck | tee build/windows/SHA256SUMS.txt
          du -h build/windows/*

      # ------------------------------------------------------------------
      # 4. Empacotamento e distribuição
      # ------------------------------------------------------------------
      - name: Empacotar para distribuição
        run: |
          cat > build/windows/LEIA-ME.txt <<'EOF'
          BLACK SIGHT — Etapa 12A (Windows x86_64 · Primeiro andar do laboratorio)
          ============================================

          COMO JOGAR
          1. Extraia todos os arquivos deste ZIP para a mesma pasta.
          2. Dê duplo clique em BlackSight.exe.
             (BlackSight.pck precisa estar na mesma pasta do .exe)

          JOGAR (ETAPA 9)
          - Clique em TESTAR MOVIMENTAÇÃO na tela inicial.
          - W A S D ....... andar (relativo à direção da câmera)
          - SHIFT ......... correr (consome stamina)
          - CTRL .......... agachar
                            ALTERNAR (padrão): um toque agacha, outro levanta
                            SEGURAR: mantenha CTRL pressionado
          - E ............. interagir / pegar o item na mira
          - 1 2 3 ......... selecionar o slot do inventário
          - G ............. soltar no chão o item do slot selecionado
                            (aparece à frente e pode ser recolhido com E)
          - R ............. remover o item do slot selecionado
                            (tecla provisória de teste; use G para soltar)
          - Mouse ......... olhar (até 89 graus para cima/baixo)
          - Esc ........... libera o mouse e abre a pausa
          - CONTINUAR ..... volta ao jogo, no mesmo lugar
          - CONFIGURAÇÕES . abre as configurações durante a pausa
          - VOLTAR AO MENU  volta à tela inicial
          - O jogador colide com piso, paredes, pilares e caixas.

          DEMONSTRAÇÃO MODULAR (ETAPA 11)
          - Clique em DEMONSTRAR MÓDULOS na tela inicial.
          - A cena mostra um corredor reto, um canto, uma sala quadrada
            (10 x 10 m), uma sala retangular (10 x 14 m), pilares, guarda-corpos
            e uma escada que liga o piso ao mezanino (4 m de altura).
          - W A S D sobe e desce a escada normalmente; não é preciso pular.
          - Os guarda-corpos impedem a queda nas bordas do mezanino.
          - ESC volta ao menu inicial; F11 alterna a tela cheia.
          - Esta cena é só uma amostra das peças: não substitui a cena
            TESTAR MOVIMENTAÇÃO nem o mapa definitivo.

          INVENTÁRIO
          - Três slots fixos, no canto inferior direito da tela.
          - Olhe para um dos quatro itens de teste (ITEM A, B, C e D) e
            pressione E: o item some do cenário e aparece no primeiro slot
            livre; o slot ocupado mostra o nome do item.
          - 1, 2 e 3 escolhem o slot — inclusive um slot vazio. O slot
            selecionado fica com fundo e borda mais claros.
          - R remove o item do slot selecionado (só para validar a remoção).
          - G solta o item do slot selecionado no chão, à frente do jogador.
            O item vira um objeto físico, aparece com o nome e pode ser
            recolhido de novo com E. Se o slot estiver vazio, nada acontece.
          - Ao soltar, o slot mostra VAZIO na hora; os outros slots ficam
            intactos. Se não houver espaço livre à frente, o item continua no
            inventário.
          - Com os três slots ocupados, tentar pegar o quarto item não troca
            nada: aparece "INVENTÁRIO CHEIO" por instantes e o item continua
            no lugar.
          - Durante a pausa o inventário não muda: E não pega, 1/2/3 não
            selecionam e R não remove.

          INTERAÇÃO
          - Olhe para um objeto interativo (o Painel de Teste) e a indicação
            [E] Interagir aparece no rodapé.
          - Alcance máximo de 2,5 m, medido do centro da câmera.
          - Paredes e caixas bloqueiam: sem linha de visão não há interação.
          - A indicação some ao olhar para outro lugar, ao se afastar ou ao
            abrir a pausa. Pressione E para acionar o objeto.

          STAMINA
          - A corrida consome 20 pontos por segundo e para ao chegar a 0.
          - Segurar SHIFT bloqueia a recuperação: exausto, a stamina fica em 0
            enquanto SHIFT continuar pressionado.
          - Ao soltar SHIFT, a stamina espera 1 segundo antes de recuperar
            (15 por segundo) parado, andando ou agachado.
          - Depois de esgotar, a corrida só volta com 20 pontos ou mais.
          - Agachado nunca se corre e a stamina não é consumida.
          - A HUD no canto inferior esquerdo mostra a stamina atual (0 a 100%)
            e acompanha o consumo, o atraso e a recuperação em tempo real.

          CONFIGURAÇÕES
          - Clique em CONFIGURAÇÕES na tela inicial ou use ESC durante o jogo.
          - É a mesma tela e o mesmo arquivo nos dois caminhos.
          - Abas: CONTROLES, ÁUDIO e VÍDEO.
          - Em CONTROLES: sensibilidade, inversão do eixo Y, MODO DE AGACHAMENTO
            e a lista real de controles (agora com E, 1 2 3 e G).
          - APLICAR grava os valores; RESTAURAR PADRÕES volta ao original;
            VOLTAR (ou Esc) retorna ao menu sem aplicar o que não foi confirmado.
          - O arquivo fica em %APPDATA%\BlackSight\settings.cfg
            (nunca dentro da pasta do jogo).

          CONTROLES
          - F11 .......... alterna entre janela e tela cheia
          - Esc .......... pausa/libera o mouse na cena de teste e, nas
                           configurações, volta ao menu anterior
          - SAIR DO JOGO . fecha o jogo (na tela inicial)
          - Alt+F4 ....... fecha o jogo

          REQUISITOS
          - Windows 10 ou 11 (64 bits)
          - Placa de vídeo com suporte a OpenGL 3.3 ou superior
            (renderizador GL Compatibility; funciona em GPUs integradas)

          OBSERVAÇÃO
          Etapa 6: stamina, modos de agachamento (ALTERNAR/SEGURAR) e lista
          real de controles, mantendo os estados de movimento da Etapa 5.
          Correção 6.1: HUD discreta no canto inferior esquerdo com a barra de
          stamina em tempo real, integrada à cena da partida.
          Correção 6.2: recuperação com atraso de 1 s depois da corrida e
          bloqueada enquanto SHIFT estiver pressionado.
          Etapa 7: interação por olhar (raycast da câmera, 2,5 m, linha de
          visão) com a indicação [E] Interagir e um painel de teste.
          Etapa 8: inventário de três slots, coleta por interação, seleção
          com 1/2/3, remoção provisória com R e aviso de inventário cheio.
          Etapa 9: soltar itens no ambiente 3D com G (posição segura, física
          simples e recolhimento com E); R continua como remoção de teste.
          Etapa 11 (revisão): biblioteca modular industrial em maps/modular/
          (grade de 2 m; paredes de 0,40 x 6 m, portas de 4 m, aberturas de
          4 m, cantos, pilastras, pisos e tetos de 2 x 2 m, corredores
          principal/secundário com cantos, T, X e terminação, pilar, viga,
          guarda-corpo, salas de pesquisa e técnica e escada) e a cena
          DEMONSTRAR MÓDULOS reconstruída. Nenhum sistema anterior foi
          alterado; ESC e SHIFT foram corrigidos.
          Correção 11.2: o rodapé/plinto deixou de dividir plano com a parede
          (z-fighting, que fazia o acabamento escuro atravessar a parede
          clara) em parede reta, canto, porta, abertura, junção em T e
          módulos rotacionados.
          Etapa 12A: PRIMEIRO ANDAR — planta completa do laboratório sobre os
          módulos da Etapa 11: vestíbulo, recepção de pé-direito duplo,
          segurança, posto de controle, corredor principal de 5,6 m livres,
          grande cruzamento central (21,6 x 21,6 m, teto de 12 m), pesquisa,
          análises, observação, armazenamento, escritórios, arquivo, área de
          funcionários, apoio logístico, elétrica, acesso à manutenção e duas
          escadas para o subsolo (norte e sul). Sem móveis, equipamentos,
          objetivos, criaturas ou multiplayer.
          Stamina e controles anteriores seguem iguais.
          Ainda não há pulo, uso/arremesso/transferência de item, portas
          funcionais, geração procedural, criaturas, multiplayer nem mapa
          definitivo.

          Versão 0.12.0 — Etapa 12A (primeiro andar do laboratório)
          EOF
          cd build/windows
          zip -9 -r ../../BlackSight-Etapa12A-Primeiro-Andar-Windows-x86_64.zip \
            BlackSight.exe BlackSight.pck LEIA-ME.txt SHA256SUMS.txt
          cd ../..
          ls -la BlackSight-Etapa12A-Primeiro-Andar-Windows-x86_64.zip
          sha256sum BlackSight-Etapa12A-Primeiro-Andar-Windows-x86_64.zip | tee ci-logs/zip-sha256.txt

      - name: TESTE 8 — listar o conteúdo do ZIP
        run: |
          unzip -l BlackSight-Etapa12A-Primeiro-Andar-Windows-x86_64.zip | tee ci-logs/zip-listing.txt
          unzip -l BlackSight-Etapa12A-Primeiro-Andar-Windows-x86_64.zip | grep -q "BlackSight.exe"
          unzip -l BlackSight-Etapa12A-Primeiro-Andar-Windows-x86_64.zip | grep -q "BlackSight.pck"
          unzip -l BlackSight-Etapa12A-Primeiro-Andar-Windows-x86_64.zip | grep -q "LEIA-ME.txt"
          unzip -t BlackSight-Etapa12A-Primeiro-Andar-Windows-x86_64.zip | tail -2

      - name: Publicar artefatos do workflow
        uses: actions/upload-artifact@v4
        with:
          name: black-sight-etapa12a-primeiro-andar-windows
          path: |
            BlackSight-Etapa12A-Primeiro-Andar-Windows-x86_64.zip
            ci-logs/render_frame.png
            ci-logs/settings_screen.png
            ci-logs/movement_test.png
            ci-logs/inventory_hud.png
            ci-logs/drop_hud.png
            ci-logs/modular_demo.png
            ci-logs/first_floor.png
          if-no-files-found: warn

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-sight-etapa12a-primeiro-andar-logs
          path: ci-logs/
          if-no-files-found: warn

      - name: Publicar diagnóstico no branch ci-diagnostics
        if: always()
        continue-on-error: true
        run: |
          # Canal de diagnóstico: publica logs/frames num branch temporário
          # (os artefatos de Actions não são acessíveis pelo ambiente de desenvolvimento).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-diagnostics
          git rm -rf --cached . > /dev/null 2>&1 || true
          mkdir -p .ci
          rm -rf .ci/*
          cp -r ci-logs .ci/ci-logs 2>/dev/null || true
          cp build/windows/SHA256SUMS.txt .ci/ 2>/dev/null || true
          git add -f .ci
          git commit -m "ci: diagnóstico da execução ${GITHUB_RUN_ID} (${GITHUB_RUN_ATTEMPT})" || true
          git push -f origin ci-diagnostics

      - name: Resumo da execução
        if: always()
        run: |
          {
            echo "## Black Sight · Etapa 12A"
            echo ""
            echo "- Godot: ${GODOT_VERSION}-${GODOT_STATUS}"
            echo "- Commit: $GITHUB_SHA"
            echo ""
            echo "### Teste de fumaça"
            echo '```'
            grep -E "SMOKE TEST|✗" ci-logs/smoke.log 2>/dev/null | tail -20 || true
            echo '```'
            echo ""
            echo "### Fluxo de interface"
            echo '```'
            grep -E "UI FLOW|✓|✗" ci-logs/ui-flow.log 2>/dev/null | tail -40 || true
            echo '```'
            echo ""
            echo "### Controlador FPS"
            echo '```'
            grep -E "MOVEMENT|✓|✗" ci-logs/movement.log 2>/dev/null | tail -40 || true
            echo '```'
            echo ""
            echo "### Sistema modular de salas"
            echo '```'
            grep -E "MODULAR TEST|✗" ci-logs/modular.log 2>/dev/null | tail -20 || true
            grep -F "Cena modular carregada" ci-logs/render_modular.log 2>/dev/null || true
            echo '```'
            echo ""
            echo "### Cena inicial e configurações"
            echo '```'
            grep -E "Tela inicial carregada|Configurações carregadas|ERROR" ci-logs/run_headless.log 2>/dev/null | head -10 || true
            grep -E "Tela inicial carregada|Configurações carregadas|ERROR" ci-logs/exported_run.log 2>/dev/null | head -10 || true
            echo '```'
            echo ""
            echo "### Binário"
            echo '```'
            cat ci-logs/binary-check.log 2>/dev/null || true
            cat ci-logs/wine-version.txt 2>/dev/null || true
            cat ci-logs/wine-exit.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows real — exportar e executar o .exe
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar pastas
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          New-Item -ItemType Directory -Force -Path godot-ci | Out-Null

      - name: Baixar Godot ${GODOT_VERSION} (Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $url = "https://github.com/godotengine/godot/releases/download/$($env:GODOT_VERSION)-$($env:GODOT_STATUS)/Godot_v$($env:GODOT_VERSION)-$($env:GODOT_STATUS)_win64.exe.zip"
          $log = "ci-logs/01-godot-download.log"
          Write-Host "Baixando: $url"
          curl.exe -L --fail --retry 3 --retry-delay 5 -o godot.zip $url *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path godot.zip)) { throw "Falha ao baixar o Godot (exit $LASTEXITCODE)" }
          Expand-Archive -Path godot.zip -DestinationPath godot-ci -Force
          $godot = (Get-ChildItem godot-ci -Filter "*win64.exe" | Select-Object -First 1).FullName
          "GODOT=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $godot --version *>&1 | Tee-Object -FilePath ci-logs/02-godot-version.log
          Write-Host "Godot instalado: $godot"

      - name: Instalar templates de exportação
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "ci-logs/03-templates.log"
          $url = "https://github.com/godotengine/godot/releases/download/$($env:GODOT_VERSION)-$($env:GODOT_STATUS)/Godot_v$($env:GODOT_VERSION)-$($env:GODOT_STATUS)_export_templates.tpz"
          curl.exe -L --fail --retry 3 --retry-delay 5 -o templates.zip $url *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path templates.zip)) { throw "Falha ao baixar os templates (exit $LASTEXITCODE)" }
          Copy-Item templates.zip templates_extract.zip -Force
          Expand-Archive -Path templates_extract.zip -DestinationPath templates_extract -Force
          $dest = Join-Path $env:APPDATA "Godot/export_templates/$($env:GODOT_VERSION).$($env:GODOT_STATUS)"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem "templates_extract/templates" -Force | ForEach-Object {
            Copy-Item $_.FullName -Destination $dest -Recurse -Force
          }
          Get-ChildItem $dest | Where-Object { $_.Name -like "*windows*" } |
            Select-Object -ExpandProperty Name | Tee-Object -FilePath $log -Append
          if (-not (Test-Path (Join-Path $dest "windows_release_x86_64.exe"))) {
            throw "Template windows_release_x86_64.exe ausente em $dest"
          }

      - name: TESTE W1 — importar recursos (headless)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "ci-logs/04-import.log"
          & $env:GODOT --headless --path . --import *>&1 | Tee-Object -FilePath $log
          Write-Host "exit code: $LASTEXITCODE"
          if (-not (Test-Path .godot/imported)) { throw "Pasta .godot/imported não foi criada" }
          foreach ($required in @(
            "shared/themes/black_sight.tres",
            "shared/fonts/cinzel/Cinzel-Regular.ttf",
            "ui/scenes/title_screen.tscn",
            "ui/scripts/title_screen.gd",
            "shared/settings/settings_schema.gd",
            "shared/settings/game_settings.gd",
            "shared/settings/audio_applier.gd",
            "shared/settings/video_applier.gd",
            "audio/default_bus_layout.tres",
            "audio/assets/sfx/ui_click.wav",
            "ui/scenes/settings_screen.tscn",
            "ui/scripts/settings_screen.gd",
            "players/scenes/player.tscn",
            "players/scripts/player_controller.gd",
            "maps/scenes/test_room.tscn",
            "match/scenes/movement_test.tscn",
            "match/scripts/movement_test.gd",
            "tools/ci/ui_flow_test.tscn",
            "tools/ci/movement_test.tscn",
            "tools/ci/modular_test.tscn",
            "tools/ci/modular_visual_check.tscn",
            "tools/ci/first_floor_test.tscn",
            "tools/ci/first_floor_visual_check.tscn",
            "maps/scenes/laboratory_first_floor.tscn",
            "match/scenes/laboratory.tscn",
            "maps/modular/rooms/room_lab_10x10.tscn",
            "maps/modular/rooms/room_tech_14x20.tscn",
            "maps/modular/corridors/corridor_tee_6.tscn",
            "maps/modular/stairs/stairs_straight.tscn",
            "maps/modular/walls/wall_door_4m.tscn",
            "maps/scenes/modular_demo_room.tscn",
            "match/scenes/modular_demo.tscn"
          )) {
            if (-not (Test-Path $required)) { throw "Arquivo esperado ausente: $required" }
          }
          "OK import — recursos e módulos presentes" | Out-File ci-logs/04-import.ok

      - name: TESTE W2 — teste de fumaça (headless)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "ci-logs/05-smoke.log"
          & $env:GODOT --headless --path . --audio-driver Dummy res://tools/ci/smoke_test.tscn *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Host "exit code do teste de fumaça: $code"
          if (-not (Select-String -Path $log -SimpleMatch "SMOKE TEST OK")) {
            throw "Teste de fumaça não passou (exit $code) — ver 05-smoke.log"
          }

      - name: TESTE W2b — fluxo real da interface no Windows (headless)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "ci-logs/05b-ui-flow.log"
          & $env:GODOT --headless --path . --fixed-fps 60 --audio-driver Dummy res://tools/ci/ui_flow_test.tscn *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Host "exit code do fluxo de interface: $code"
          if (-not (Select-String -Path $log -SimpleMatch "UI FLOW OK")) {
            throw "Fluxo de interface não passou (exit $code) — ver 05b-ui-flow.log"
          }

      - name: TESTE W2c — controlador FPS e cena de teste no Windows (headless)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "ci-logs/05c-movement.log"
          & $env:GODOT --headless --path . --fixed-fps 60 --audio-driver Dummy res://tools/ci/movement_test.tscn *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Host "exit code do teste de movimento: $code"
          if (-not (Select-String -Path $log -SimpleMatch "MOVEMENT TEST OK")) {
            throw "Teste do controlador não passou (exit $code) — ver 05c-movement.log"
          }

      - name: TESTE W2d — drop junto a obstáculos no Windows (headless)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "ci-logs/05d-drop-obstacle.log"
          & $env:GODOT --headless --path . --fixed-fps 60 --audio-driver Dummy res://tools/ci/drop_obstacle_test.tscn *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Host "exit code do teste de drop: $code"
          if (-not (Select-String -Path $log -SimpleMatch "DROP OBSTACLE TEST OK")) {
            throw "Teste de drop junto a obstáculos não passou (exit $code) — ver 05d-drop-obstacle.log"
          }

      - name: TESTE W2e — sistema modular de salas no Windows (headless)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "ci-logs/05e-modular.log"
          & $env:GODOT --headless --path . --fixed-fps 60 --audio-driver Dummy res://tools/ci/modular_test.tscn *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Host "exit code do teste modular: $code"
          if (-not (Select-String -Path $log -SimpleMatch "MODULAR TEST OK")) {
            throw "Teste do sistema modular não passou (exit $code) — ver 05e-modular.log"
          }

      - name: TESTE W2f — primeiro andar do laboratório no Windows (headless)
        timeout-minutes: 14
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "ci-logs/05f-first-floor.log"
          & $env:GODOT --headless --path . --fixed-fps 60 --audio-driver Dummy res://tools/ci/first_floor_test.tscn *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Host "exit code do teste do primeiro andar: $code"
          if (-not (Select-String -Path $log -SimpleMatch "PRIMEIRO ANDAR OK")) {
            throw "Teste do primeiro andar não passou (exit $code) — ver 05f-first-floor.log"
          }

      - name: TESTE W3 — executar a cena inicial (headless, 240 frames)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "ci-logs/06-run-headless.log"
          & $env:GODOT --headless --path . --audio-driver Dummy --quit-after 240 *>&1 | Tee-Object -FilePath $log
          Write-Host "exit code: $LASTEXITCODE"
          if (-not (Select-String -Path $log -SimpleMatch "[Black Sight] Tela inicial carregada")) {
            throw "A cena inicial não inicializou no Windows"
          }
          if (-not (Select-String -Path $log -SimpleMatch "[Black Sight] Configurações carregadas")) {
            throw "O autoload GameSettings não inicializou no Windows"
          }
          if (Select-String -Path $log -Pattern "SCRIPT ERROR") { throw "SCRIPT ERROR durante a execução" }

      - name: TESTE W4 — exportar o executável (release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          $log = "ci-logs/07-export.log"
          & $env:GODOT --headless --path . --export-release "Windows Desktop" "build/windows/BlackSight.exe" *>&1 | Tee-Object -FilePath $log
          Write-Host "exit code: $LASTEXITCODE"
          Get-ChildItem build/windows | Select-Object Name, Length
          if (-not (Test-Path build/windows/BlackSight.exe)) { throw "BlackSight.exe não foi gerado" }
          if (-not (Test-Path build/windows/BlackSight.pck)) { throw "BlackSight.pck não foi gerado" }

      - name: TESTE W5 — executar o .exe exportado (headless)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "ci-logs/08-exe-headless.log"
          $errLog = "ci-logs/08-exe-headless.err.log"
          Remove-Item -Recurse -Force (Join-Path $env:APPDATA "BlackSight") -ErrorAction SilentlyContinue
          $exe = Join-Path $PWD "build/windows/BlackSight.console.exe"
          if (-not (Test-Path $exe)) { $exe = Join-Path $PWD "build/windows/BlackSight.exe" }
          Write-Host "Executando: $exe"
          $proc = Start-Process -FilePath $exe `
            -ArgumentList "--headless","--audio-driver","Dummy","--quit-after","240" `
            -RedirectStandardOutput $log -RedirectStandardError $errLog -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(180000)) {
            $proc.Kill()
            throw "O .exe não terminou em 180s"
          }
          Get-Content $log -ErrorAction SilentlyContinue
          Get-Content $errLog -ErrorAction SilentlyContinue
          if (-not (Select-String -Path $log -SimpleMatch "[Black Sight] Tela inicial carregada" -ErrorAction SilentlyContinue)) {
            throw "O .exe não registrou a inicialização da cena inicial"
          }
          if (Select-String -Path $log -Pattern "SCRIPT ERROR" -ErrorAction SilentlyContinue) { throw "SCRIPT ERROR no .exe" }
          "OK: .exe exportado iniciou e carregou a cena inicial no Windows" | Out-File ci-logs/08-exe-headless.ok

      - name: TESTE W5b — configurações criadas pelo .exe em %APPDATA%
        shell: pwsh
        run: |
          $cfg = Join-Path $env:APPDATA "BlackSight/settings.cfg"
          if (-not (Test-Path $cfg)) { throw "O .exe não criou $cfg (user://settings.cfg)" }
          Get-Content $cfg | Tee-Object -FilePath ci-logs/08b-settings-cfg.log
          foreach ($key in @("mouse_sensitivity_x","crouch_mode","master_volume","window_mode","vsync")) {
            if (-not (Select-String -Path $cfg -SimpleMatch $key)) { throw "Configuração ausente no arquivo: $key" }
          }
          "OK: user://settings.cfg criado pelo .exe exportado" | Out-File ci-logs/08b-settings-cfg.ok

      - name: TESTE W6 — abrir o .exe com janela
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $exe = Join-Path $PWD "build/windows/BlackSight.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          $proc.Refresh()
          $alive = -not $proc.HasExited
          $title = $proc.MainWindowTitle
          $status = "vivo_apos_25s=$alive`ntitulo_janela=$title"
          $status | Tee-Object -FilePath ci-logs/09-exe-window.log
          if ($alive) { Stop-Process -Id $proc.Id -Force }
          if (-not $alive) { throw "O .exe encerrou sozinho ao abrir com janela" }

      - name: TESTE W6b — closes dos encaixes (renderização real)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path ci-logs/visual | Out-Null
          & $env:GODOT --path . --fixed-fps 60 res://tools/ci/modular_visual_check.tscn *>&1 |
            Tee-Object -FilePath ci-logs/13-visual.log
          $code = $LASTEXITCODE
          Write-Host "exit code das capturas de encaixe: $code"
          $pngs = @(Get-ChildItem ci-logs/visual -Filter *.png -ErrorAction SilentlyContinue)
          Write-Host "capturas geradas: $($pngs.Count)"
          if ($code -ne 0) { throw "Capturas de encaixe falharam (exit $code) — ver 13-visual.log" }
          if ($pngs.Count -lt 10) { throw "Capturas insuficientes ($($pngs.Count) de 10)" }

      - name: TESTE W6c — capturas do primeiro andar (renderização real)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path ci-logs/visual-12a | Out-Null
          & $env:GODOT --path . --fixed-fps 60 res://tools/ci/first_floor_visual_check.tscn *>&1 |
            Tee-Object -FilePath ci-logs/14-visual-12a.log
          $code = $LASTEXITCODE
          Write-Host "exit code das capturas do primeiro andar: $code"
          $pngs = @(Get-ChildItem ci-logs/visual-12a -Filter *.png -ErrorAction SilentlyContinue)
          Write-Host "capturas geradas: $($pngs.Count)"
          if ($code -ne 0) { throw "Capturas do primeiro andar falharam (exit $code) — ver 14-visual-12a.log" }
          if ($pngs.Count -lt 14) { throw "Capturas insuficientes ($($pngs.Count) de 14)" }

      - name: TESTE W7 — inspecionar o pacote .pck e os metadados do .exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          python tools/ci/inspect_pck.py build/windows/BlackSight.pck *>&1 | Tee-Object -FilePath ci-logs/10-pck.log
          if (-not (Select-String -Path ci-logs/10-pck.log -SimpleMatch "PACOTE OK")) { throw "Pacote .pck inválido" }
          $info = (Get-Item build/windows/BlackSight.exe).VersionInfo
          @(
            "ProductName=$($info.ProductName)"
            "FileDescription=$($info.FileDescription)"
            "FileVersion=$($info.FileVersion)"
            "CompanyName=$($info.CompanyName)"
          ) | Tee-Object -FilePath ci-logs/11-exe-versioninfo.log
          if ($info.ProductName -notlike "*Black Sight*") { throw "Metadados do .exe sem ProductName 'Black Sight'" }
          if ($info.FileVersion -notlike "0.12.0*") { throw "FileVersion inesperada: $($info.FileVersion)" }

      - name: Empacotar para distribuição
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $readme = @"
          BLACK SIGHT - Etapa 12A (Windows x86_64 - Primeiro andar do laboratorio)
          ============================================

          COMO JOGAR
          1. Extraia todos os arquivos deste ZIP para a mesma pasta.
          2. De duplo clique em BlackSight.exe.
             (BlackSight.pck precisa estar na mesma pasta do .exe)

          ARQUIVOS
          - BlackSight.exe ......... o jogo (use este)
          - BlackSight.pck ......... dados do jogo (obrigatorio)
          - SHA256SUMS.txt ......... conferencia de integridade

          JOGAR (ETAPA 9)
          - Clique em TESTAR MOVIMENTACAO na tela inicial.
          - W A S D ....... andar (relativo a direcao da camera)
          - SHIFT ......... correr (consome stamina)
          - CTRL .......... agachar
                            ALTERNAR (padrao): um toque agacha, outro levanta
                            SEGURAR: mantenha CTRL pressionado
          - E ............. interagir / pegar o item na mira
          - 1 2 3 ......... selecionar o slot do inventario
          - G ............. soltar no chao o item do slot selecionado
                            (aparece a frente e pode ser recolhido com E)
          - R ............. remover o item do slot selecionado
                            (tecla provisoria de teste; use G para soltar)
          - Mouse ......... olhar (ate 89 graus para cima/baixo)
          - Esc ........... libera o mouse e abre a pausa
          - CONTINUAR ..... volta ao jogo, no mesmo lugar
          - CONFIGURACOES . abre as configuracoes durante a pausa
          - VOLTAR AO MENU  volta a tela inicial
          - O jogador colide com piso, paredes, pilares e caixas.

          DEMONSTRACAO MODULAR (ETAPA 11)
          - Clique em DEMONSTRAR MODULOS na tela inicial.
          - A cena mostra corredor reto, canto, sala quadrada (10 x 10 m),
            sala retangular (10 x 14 m), pilares, guarda-corpos e uma escada
            que liga o piso ao mezanino (4 m de altura).
          - W A S D sobe e desce a escada normalmente; nao e preciso pular.
          - Os guarda-corpos impedem a queda nas bordas do mezanino.
          - ESC volta ao menu inicial; F11 alterna a tela cheia.
          - A cena e uma amostra das pecas: nao substitui TESTAR MOVIMENTACAO
            nem o mapa definitivo.

          INVENTARIO
          - Tres slots fixos, no canto inferior direito da tela.
          - Olhe para um dos quatro itens de teste (ITEM A, B, C e D) e
            pressione E: o item some do cenario e aparece no primeiro slot
            livre; o slot ocupado mostra o nome do item.
          - 1, 2 e 3 escolhem o slot - inclusive um slot vazio. O slot
            selecionado fica com fundo e borda mais claros.
          - R remove o item do slot selecionado (so para validar a remocao).
          - G solta o item do slot selecionado no chao, a frente do jogador.
            O item vira um objeto fisico, aparece com o nome e pode ser
            recolhido de novo com E. Se o slot estiver vazio, nada acontece.
          - Ao soltar, o slot mostra VAZIO na hora; os outros slots ficam
            intactos. Se nao houver espaco livre a frente, o item continua no
            inventario.
          - Com os tres slots ocupados, tentar pegar o quarto item nao troca
            nada: aparece "INVENTARIO CHEIO" por instantes e o item continua
            no lugar.
          - Durante a pausa o inventario nao muda: E nao pega, 1/2/3 nao
            selecionam e R nao remove.

          INTERACAO
          - Olhe para um objeto interativo (o Painel de Teste) e a indicacao
            [E] Interagir aparece no rodape.
          - Alcance maximo de 2,5 m, medido do centro da camera.
          - Paredes e caixas bloqueiam: sem linha de visao nao ha interacao.
          - A indicacao some ao olhar para outro lugar, ao se afastar ou ao
            abrir a pausa. Pressione E para acionar o objeto.

          STAMINA
          - A corrida consome 20 pontos por segundo e para ao chegar a 0.
          - Segurar SHIFT bloqueia a recuperacao: exausto, a stamina fica em 0
            enquanto SHIFT continuar pressionado.
          - Ao soltar SHIFT, a stamina espera 1 segundo antes de recuperar
            (15 por segundo) parado, andando ou agachado.
          - Depois de esgotar, a corrida so volta com 20 pontos ou mais.
          - Agachado nunca corre e a stamina nao e consumida.
          - A HUD no canto inferior esquerdo mostra a stamina atual (0 a 100%)
            e acompanha o consumo, o atraso e a recuperacao em tempo real.

          CONFIGURACOES
          - Clique em CONFIGURACOES na tela inicial ou use ESC durante o jogo.
          - E a mesma tela e o mesmo arquivo nos dois caminhos.
          - Abas: CONTROLES, AUDIO e VIDEO.
          - Em CONTROLES: sensibilidade, inversao do eixo Y, MODO DE AGACHAMENTO
            e a lista real de controles (agora com E, 1 2 3 e G).
          - APLICAR grava; RESTAURAR PADROES volta ao original;
            VOLTAR (ou Esc) retorna ao menu sem aplicar o que nao foi confirmado.
          - Arquivo: %APPDATA%\BlackSight\settings.cfg (fora da pasta do jogo).

          CONTROLES
          - F11 .......... alterna entre janela e tela cheia
          - Esc .......... pausa/libera o mouse na cena de teste e, nas
                           configuracoes, volta ao menu anterior
          - SAIR DO JOGO . fecha o jogo (na tela inicial)
          - Alt+F4 ....... fecha o jogo

          REQUISITOS
          - Windows 10 ou 11 (64 bits)
          - Placa de video com OpenGL 3.3 ou superior
            (renderizador GL Compatibility; funciona em GPUs integradas)

          OBSERVACAO
          Etapa 6: stamina, modos de agachamento (ALTERNAR/SEGURAR) e lista
          real de controles, mantendo os estados de movimento da Etapa 5.
          Correcao 6.1: HUD discreta no canto inferior esquerdo com a barra de
          stamina em tempo real, integrada a cena da partida.
          Correcao 6.2: recuperacao com atraso de 1 s depois da corrida e
          bloqueada enquanto SHIFT estiver pressionado.
          Etapa 7: interacao por olhar (raycast da camera, 2,5 m, linha de
          visao) com a indicacao [E] Interagir e um painel de teste.
          Etapa 8: inventario de tres slots, coleta por interacao, selecao
          com 1/2/3, remocao provisoria com R e aviso de inventario cheio.
          Etapa 9: soltar itens no ambiente 3D com G (posicao segura, fisica
          simples e recolhimento com E); R continua como remocao de teste.
          Etapa 11 (revisao): biblioteca modular industrial (grade de 2 m;
          paredes de 0,40 x 6 m, portas e aberturas de 4 m, cantos, pisos e
          tetos, corredores com cantos/T/X/terminacao, pilar, viga,
          guarda-corpo, salas e escada) e a cena DEMONSTRAR MODULOS
          reconstruida. ESC e SHIFT corrigidos. Nenhum
          sistema anterior foi alterado.
          Correcao 11.2: rodape e plinto deixaram de dividir plano com a
          parede (z-fighting) em parede reta, canto, porta, abertura, juncao
          em T e modulos rotacionados.
          Etapa 12A: PRIMEIRO ANDAR - planta completa do laboratorio sobre os
          modulos da Etapa 11: vestibulo, recepcao de pe-direito duplo,
          seguranca, posto de controle, corredor principal de 5,6 m livres,
          grande cruzamento central (21,6 x 21,6 m, teto de 12 m), pesquisa,
          analises, observacao, armazenamento, escritorios, arquivo, area de
          funcionarios, apoio logistico, eletrica, acesso a manutencao e duas
          escadas para o subsolo (norte e sul). Sem moveis, equipamentos,
          objetivos, criaturas ou multiplayer.
          Stamina e controles anteriores seguem iguais.
          Ainda nao ha pulo, uso/arremesso/transferencia de item, portas
          funcionais, geracao procedural, criaturas, multiplayer nem mapa
          definitivo.

          Versao 0.12.0 - Etapa 12A (primeiro andar do laboratorio)
          "@
          $readme | Out-File -FilePath build/windows/LEIA-ME.txt -Encoding utf8
          $lines = @()
          foreach ($f in @("BlackSight.exe","BlackSight.pck")) {
            $h = (Get-FileHash (Join-Path "build/windows" $f) -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $f"
          }
          $lines | Out-File -FilePath build/windows/SHA256SUMS.txt -Encoding ascii
          Get-Content build/windows/SHA256SUMS.txt
          Get-ChildItem build/windows | Select-Object Name, Length
          $zip = Join-Path $PWD "BlackSight-Etapa12A-Primeiro-Andar-Windows-x86_64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "build/windows/*" -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object Name, Length
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "zip_sha256=$zipHash" | Tee-Object -FilePath ci-logs/12-zip.log
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead($zip).Entries |
            ForEach-Object { "$($_.FullName) ($($_.Length) bytes)" }
          $entries | Tee-Object -FilePath ci-logs/12-zip.log -Append
          foreach ($required in @("BlackSight.exe","BlackSight.pck","LEIA-ME.txt","SHA256SUMS.txt")) {
            if (-not ($entries -match [regex]::Escape($required))) { throw "ZIP sem $required" }
          }

      - name: Publicar artefatos (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: black-sight-etapa12a-primeiro-andar-windows-real
          path: |
            BlackSight-Etapa12A-Primeiro-Andar-Windows-x86_64.zip
            ci-logs/
          if-no-files-found: warn

      - name: Resumo dos testes e do pacote (Windows)
        if: success()
        shell: pwsh
        run: |
          # As notas da release carregam as contagens reais do Windows e o
          # tamanho/SHA-256 do ZIP que está sendo publicado: os números do
          # arquivo de notas vêm de um build anterior e não podem ser copiados.
          $bt = [char]96
          $rows = @(
            @{ Nome = "Fumaça (smoke_test.gd)"; Log = "ci-logs/05-smoke.log" },
            @{ Nome = "Fluxo de interface (ui_flow_test.gd)"; Log = "ci-logs/05b-ui-flow.log" },
            @{ Nome = "Controlador FPS + inventário + drop (movement_test.gd)"; Log = "ci-logs/05c-movement.log" },
            @{ Nome = "Sistema modular de salas (modular_test.gd)"; Log = "ci-logs/05e-modular.log" },
            @{ Nome = "Primeiro andar do laboratório (first_floor_test.gd)"; Log = "ci-logs/05f-first-floor.log" }
          )
          $linhas = @("", "## Testes automatizados (Windows)", "", "| Suíte | Resultado |", "| --- | --- |")
          foreach ($r in $rows) {
            $texto = Get-Content $r.Log -Encoding utf8 -Raw
            $m = [regex]::Match($texto, "(\d+) verifica..es aprovadas")
            if ($m.Success) {
              $linhas += "| $($r.Nome) | $($m.Groups[1].Value) verificações aprovadas |"
            } else {
              $linhas += "| $($r.Nome) | sem linha de resumo no log |"
              Write-Host "::warning::sem linha de resumo em $($r.Log)"
            }
          }
          $zip = "BlackSight-Etapa12A-Primeiro-Andar-Windows-x86_64.zip"
          $info = Get-Item $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $linhas += @("", "## Pacote verificado neste build", "", "| Item | Valor |", "| --- | --- |")
          $linhas += "| Arquivo | $bt$zip$bt |"
          $linhas += "| Tamanho | $($info.Length) bytes |"
          $linhas += "| SHA-256 | $bt$hash$bt |"
          $linhas += ""
          $linhas | Out-File -FilePath ci-logs/release-summary.md -Encoding utf8
          Get-Content ci-logs/release-summary.md

      - name: Criar release no GitHub
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notas = (Get-Content docs/RELEASE_NOTES_ETAPA12A.md -Encoding utf8 -Raw).TrimEnd()
          $extra = Get-Content ci-logs/release-summary.md -Encoding utf8 -Raw
          New-Item -ItemType Directory -Force -Path build | Out-Null
          ($notas + "`n" + $extra) | Out-File -FilePath build/release-notes.md -Encoding utf8
          gh release create v0.12.0-etapa12a-primeiro-andar "BlackSight-Etapa12A-Primeiro-Andar-Windows-x86_64.zip" --target $env:GITHUB_SHA --title "Black Sight - Etapa 12A - Primeiro andar do laboratorio - Windows x86_64" --notes-file build/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Falha ao criar a release" }

      - name: Publicar diagnóstico Windows (branch ci-windows)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-windows
          git rm -rf --cached . 2>$null | Out-Null
          New-Item -ItemType Directory -Force -Path .ci | Out-Null
          Copy-Item ci-logs -Destination .ci/ -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem build/windows -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.Name) $($_.Length)" } |
            Out-File -Append .ci/ci-logs/windows-build-files.txt
          git add -f .ci
          git commit -m "ci: diagnostico windows $($env:GITHUB_RUN_ID)" 2>$null
          git push -f origin ci-windows

      - name: Resumo (Windows)
        if: always()
        shell: pwsh
        run: |
          $summary = @("## Black Sight - Etapa 12A (Windows real - Primeiro andar do laboratorio)", "")
          foreach ($f in (Get-ChildItem ci-logs -Filter *.log -ErrorAction SilentlyContinue | Sort-Object Name)) {
            $summary += "- $($f.Name)"
          }
          $summary += ""
          $summary += '```'
          $summary += (Get-Content ci-logs/11-exe-versioninfo.log -ErrorAction SilentlyContinue)
          $summary += (Get-Content ci-logs/12-zip.log -ErrorAction SilentlyContinue | Select-Object -First 12)
          $summary += '```'
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
